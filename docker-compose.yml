name: air-alerts

services:
  web:
    build: .
    image: air-alerts:latest
    container_name: air-alerts-web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/alerts.db
    volumes:
      - alerts-data:/data
    # Адреса прив'язки береться з .env. Типове значення — 127.0.0.1,
    # тобто без явного налаштування сервіс НЕ виставляється в мережу.
    # Для доступу лише через VPN вкажи адресу тунельного інтерфейсу.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/status',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  poller:
    build: .
    image: air-alerts:latest
    container_name: air-alerts-poller
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/alerts.db
    volumes:
      - alerts-data:/data
    command: ["python", "-m", "app.poller"]
    depends_on:
      - web

volumes:
  alerts-data:
